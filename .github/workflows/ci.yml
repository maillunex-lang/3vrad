name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  server:
    name: Server test & migrate smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paradise
          POSTGRES_PASSWORD: paradise_dev
          POSTGRES_DB: paradise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paradise -d paradise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/server
    env:
      DATABASE_URL: postgres://paradise:paradise_dev@localhost:5432/paradise?sslmode=disable
      APP_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/server/go.sum
      - run: go mod download
      - run: go test ./...
      - run: go build -o /tmp/paradise-server ./cmd/server
      - name: Migration + health smoke
        run: |
          /tmp/paradise-server &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/readyz >/dev/null; then
              curl -sf http://127.0.0.1:8080/healthz
              curl -sf http://127.0.0.1:8080/api/v1/version
              kill $PID
              exit 0
            fi
            sleep 1
          done
          kill $PID || true
          echo "server did not become ready"
          exit 1
