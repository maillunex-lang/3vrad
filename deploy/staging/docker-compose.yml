# Staging stack. Use staging secrets via env file (never commit real values).
# Copy .env.example -> .env and fill staging credentials.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paradise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paradise}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../../apps/server
    environment:
      APP_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-paradise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-paradise}?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.example.com}
      MIGRATIONS_DIR: /app/migrations
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ../../apps/client
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${CLIENT_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ../../apps/admin
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${ADMIN_PORT:-8089}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  staging_pgdata:
